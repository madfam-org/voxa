# Template only — apply secrets via `enclii onboard --secrets-file` or Vault ESO.
# Do NOT commit real values. Do NOT add this file to k8s/ manifests.
apiVersion: v1
kind: Secret
metadata:
  name: voxa-secrets
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  DATABASE_URL: postgresql://REPLACE_USER:REPLACE@REPLACE_POSTGRES_HOST:5432/REPLACE_DB
  # Shared Redis with AUTH and this app's own DB index (operator-assigned).
  REDIS_URL: redis://:REPLACE_URL_ENCODED_PASSWORD@REPLACE_REDIS_HOST:6379/REPLACE_DB_INDEX
  JANUA_ISSUER_URL: https://auth.madfam.io
  JANUA_JWKS_URL: https://auth.madfam.io/.well-known/jwks.json
  JANUA_AUDIENCE: voxa
  # Set to "true" once web OIDC client is live
  JANUA_AUTH_REQUIRED: "false"
  # Web OIDC (server-side; NEXT_PUBLIC_* set in Deployment env)
  OIDC_CLIENT_SECRET: REPLACE
  SESSION_COOKIE_SECRET: REPLACE
  SENTRY_DSN: ""
  # Text predictions through Selva (off by default). The client id and secret
  # are this service's Janua client_credentials pair, filed by the platform
  # provisioner; never typed here.
  SELVA_ENABLED: "false"
  SELVA_BASE_URL: ""
  SELVA_CLIENT_ID: ""
  SELVA_CLIENT_SECRET: ""
  JANUA_TOKEN_URL: https://auth.madfam.io/api/v1/oauth/token
  # Per signed-in user, per replica (after authentication).
  RATE_LIMIT_PER_MINUTE: "120"
  # Per client address (CF-Connecting-IP), per replica, before authentication.
  RATE_LIMIT_IP_PER_MINUTE: "600"
  # Total bytes of uploaded media per user (default 500 MB).
  MEDIA_QUOTA_BYTES_PER_USER: "524288000"
