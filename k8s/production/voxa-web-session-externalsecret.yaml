# The web's session secret, by NAME only, from the platform's secret store.
#   - auth_secret: generated inside the secret store by the platform's secret
#     intake (target voxa/web-session, `--generate auth_secret`); no person or
#     terminal ever holds it. It encrypts the web's own session cookie
#     (Auth.js AUTH_SECRET) and is never the Janua client secret (R42).
# The intake lowercases keys before it writes, so the remote property is
# lowercase.
#
# A dedicated Secret owned by this ExternalSecret: voxa-secrets is written at
# onboarding and is not managed here, and an owning ExternalSecret over an
# existing Secret would delete every key it does not produce.
#
# Sync-wave -1: applied before the wave-0 Deployments. The web reads the key
# with `optional: true`: until the intake has written it, /api/health/ready
# answers 503 (missing: AUTH_SECRET) and the rollout stays on the previous
# pods (maxUnavailable: 0).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: voxa-web-session
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: voxa-web-session
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: secret/voxa
        property: auth_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
