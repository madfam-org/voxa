# Keep at least one web and one API pod serving through voluntary disruptions
# (node drains, k3s upgrades). Both Deployments set replicas: 2 in git, the
# intended floor; Argo CD ignores /spec/replicas, so the live count is scaled
# by the platform operator (AGENTS.md invariant 20). minAvailable must stay
# below replicas or drains block (scripts/launch/deploy-contract.test.mjs).
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voxa-web
  labels:
    app: voxa-web
    app.kubernetes.io/name: voxa-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: voxa
    enclii.dev/managed-by: switchyard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: voxa-web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voxa-api
  labels:
    app: voxa-api
    app.kubernetes.io/name: voxa-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: voxa
    enclii.dev/managed-by: switchyard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: voxa-api
