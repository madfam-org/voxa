# Allow Voxa API pods to reach shared Postgres/Redis in the data namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: voxa
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: 5432
          protocol: TCP
        - port: 6432
          protocol: TCP
        - port: 6379
          protocol: TCP
