# Temporary cosign bypass until ghcr.io/madfam-org/voxa/* packages are public
# (Kyverno keyless verification requires anonymous GHCR manifest pull).
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: voxa-signature-temporary
  namespace: voxa
  annotations:
    enclii.dev/reason: "Voxa GHCR packages are private; Kyverno verify-image-signatures cannot pull manifests."
    enclii.dev/scope: "Voxa production deployments until GHCR visibility is public."
spec:
  exceptions:
    - policyName: verify-image-signatures
      ruleNames:
        - check-signature
        - autogen-check-signature
  match:
    any:
      - resources:
          kinds:
            - Deployment
            - Pod
            - ReplicaSet
          namespaces:
            - voxa
          names:
            - voxa-api*
            - voxa-web*
