---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxa-web
  labels:
    app: voxa-web
    app.kubernetes.io/name: voxa-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: voxa
    enclii.dev/managed-by: switchyard
  annotations:
    reloader.stakater.com/match: "true"
spec:
  replicas: 2
  # Surge-first rollouts: a new pod must pass readiness before an old one is
  # removed, so a rollout never leaves the Service without a ready endpoint.
  # If the surge pod cannot schedule, the rollout stalls on the old pods
  # (still serving) instead of taking the site down.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: voxa-web
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-05T00:18:14Z"
        reloader.stakater.com/match: "true"
        secret.reloader.stakater.com/reload: "voxa-secrets,voxa-web-session"
      labels:
        app: voxa-web
        app.kubernetes.io/name: voxa-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: voxa
        enclii.dev/managed-by: switchyard
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: voxa-web
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/madfam-org/voxa/voxa-web@sha256:45f20ea7ba64f3b9eb9a828032950a7b0f5a0d0cdfe45db10ceea77a291f2820
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: NEXT_PUBLIC_API_URL
              value: "https://voxa-api.madfam.io"
            - name: NEXT_PUBLIC_BASE_URL
              value: "https://voxa.madfam.io"
            # robots.txt/sitemap.xml/llms.txt: only this host is crawlable (R40).
            - name: VOXA_INDEXABLE_HOSTS
              value: "voxa.madfam.io"
            # Sign-in (Auth.js + Janua; docs/auth/JANUA.md). The Janua client is the
            # one the web always used; its secret keeps its Secret key name.
            # This web serves the landing host and the app host, and the PKCE,
            # state, nonce and session cookies are host-scoped, so sign-in must
            # stay on the host the browser used. Behind the tunnel the standalone
            # server hands route handlers a request URL on its bind address
            # (0.0.0.0:3000); the Auth.js handlers rebuild it from the forwarded
            # host, and only for a host in AUTH_PUBLIC_HOSTS (any other answers
            # 400; src/lib/public-origin.ts, docs/auth/JANUA.md).
            # No AUTH_URL: the image rebuilds each request's URL from the allow-listed
            # public host the browser used (voxa#51), so sign-in works on both hosts.
            # The deploy smoke checks that each host's callback stays on that host
            # (VERIFY_SAME_HOST=1).
            - name: AUTH_PUBLIC_HOSTS
              value: "voxa.madfam.io,voxa-app.madfam.io"
            - name: AUTH_JANUA_ISSUER
              value: "https://auth.madfam.io"
            - name: AUTH_JANUA_CLIENT_ID
              value: "jnc_4qRWyI-ul_GL28hrSxrX7AvIyotFMBuB"
            - name: AUTH_JANUA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voxa-secrets
                  key: OIDC_CLIENT_SECRET
                  optional: true
            # Encrypts the session cookie: this app's own secret, never the Janua
            # client secret (R42). Delivered by the voxa-web-session
            # ExternalSecret (secret intake, --generate). Optional here so a
            # missing key shows up as
            # /api/health/ready 503 (missing: AUTH_SECRET) and the rollout stalls on
            # the previous pods (maxUnavailable: 0).
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: voxa-web-session
                  key: AUTH_SECRET
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Liveness: the process answers at all (no config or dependency checks,
          # so a config problem never crash-loops the pod).
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          # Readiness: the server can serve what it advertises (sign-in config
          # present). Gates traffic to new pods during rollouts.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          # Let the endpoint removal reach the Service and tunnel before the
          # process gets SIGTERM, so in-flight and new requests do not hit a
          # closing socket (node:22-alpine ships /bin/sleep).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
