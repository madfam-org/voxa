---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxa-web
  labels:
    app: voxa-web
    app.kubernetes.io/name: voxa-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: voxa
    enclii.dev/managed-by: switchyard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voxa-web
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-07T09:15:00Z"
      labels:
        app: voxa-web
        app.kubernetes.io/name: voxa-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: voxa
        enclii.dev/managed-by: switchyard
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/madfam-org/voxa/voxa-web@sha256:b1d5d70a9d46d633a23c5475429251b6a2cf3df4a4e9c6b9f04bd64a2f867cf6
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: NEXT_PUBLIC_API_URL
              value: "https://voxa-api.madfam.io"
            - name: NEXT_PUBLIC_OIDC_ISSUER
              value: "https://auth.madfam.io"
            - name: OIDC_ISSUER
              value: "https://auth.madfam.io"
            - name: NEXT_PUBLIC_OIDC_CLIENT_ID
              value: "jnc_4qRWyI-ul_GL28hrSxrX7AvIyotFMBuB"
            - name: OIDC_CLIENT_ID
              value: "jnc_4qRWyI-ul_GL28hrSxrX7AvIyotFMBuB"
            - name: NEXT_PUBLIC_BASE_URL
              value: "https://voxa.madfam.io"
          envFrom:
            - secretRef:
                name: voxa-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
