---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxa-web
  labels:
    app: voxa-web
    app.kubernetes.io/name: voxa-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: voxa
    enclii.dev/managed-by: switchyard
  annotations:
    reloader.stakater.com/match: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: voxa-web
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-12T20:37:19Z"
        reloader.stakater.com/match: "true"
        secret.reloader.stakater.com/reload: "voxa-secrets"
      labels:
        app: voxa-web
        app.kubernetes.io/name: voxa-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: voxa
        enclii.dev/managed-by: switchyard
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/madfam-org/voxa/voxa-web@sha256:305f76d8b32afbc0e295731d8e0f350eeeef130adde34d51b65f8bef188e64f3
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: NEXT_PUBLIC_API_URL
              value: "https://voxa-api.madfam.io"
            - name: NEXT_PUBLIC_OIDC_ISSUER
              value: "https://auth.madfam.io"
            - name: OIDC_ISSUER
              value: "https://auth.madfam.io"
            - name: NEXT_PUBLIC_OIDC_CLIENT_ID
              value: "jnc_4qRWyI-ul_GL28hrSxrX7AvIyotFMBuB"
            - name: OIDC_CLIENT_ID
              value: "jnc_4qRWyI-ul_GL28hrSxrX7AvIyotFMBuB"
            - name: NEXT_PUBLIC_BASE_URL
              value: "https://voxa.madfam.io"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voxa-secrets
                  key: OIDC_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
