---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxa-api
  labels:
    app: voxa-api
    app.kubernetes.io/name: voxa-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: voxa
    enclii.dev/managed-by: switchyard
    enclii.dev/environment: staging
spec:
  replicas: 1
  # Surge-first rollouts: never drop below the desired ready count.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: voxa-api
  template:
    metadata:
      labels:
        app: voxa-api
        app.kubernetes.io/name: voxa-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: voxa
        enclii.dev/managed-by: switchyard
        enclii.dev/environment: staging
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-07T10:05:00Z"
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: voxa-api
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/madfam-org/voxa/voxa-api@sha256:ded486e69462de44720867e8714807a24f6731621a220e3030ce922e3e5a89d3
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: LISTEN_HOST
              value: "0.0.0.0"
            - name: ENCLII_ENVIRONMENT
              value: staging
            - name: VOXA_JANUA_AUTH_REQUIRED
              value: "true"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://voxa-staging.madfam.io,https://voxa-app-staging.madfam.io"
            # Cross-replica co-editing (WebSocket fan-out and presence). The URL
            # carries the shared Redis password and this app's DB index, so it is
            # a key of voxa-secrets, never a literal here. Optional: without it
            # (or with Redis unreachable) the API runs the local hub and
            # /health/ready reports syncHub=local plus a syncHubWarning.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: voxa-secrets
                  key: REDIS_URL
                  optional: true
          envFrom:
            - secretRef:
                name: voxa-secrets
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 12
            periodSeconds: 5
          # Let the endpoint removal propagate before SIGTERM (see voxa-web).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
