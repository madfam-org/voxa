---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxa-web
  labels:
    app: voxa-web
    app.kubernetes.io/name: voxa-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: voxa
    enclii.dev/managed-by: switchyard
    enclii.dev/environment: staging
  annotations:
    reloader.stakater.com/match: "true"
spec:
  replicas: 1
  # Surge-first rollouts: a new pod must pass readiness before an old one is
  # removed, so a rollout never leaves the Service without a ready endpoint.
  # If the surge pod cannot schedule, the rollout stalls on the old pods
  # (still serving) instead of taking the site down.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: voxa-web
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-04T08:11:59Z"
        reloader.stakater.com/match: "true"
        secret.reloader.stakater.com/reload: "voxa-secrets"
      labels:
        app: voxa-web
        app.kubernetes.io/name: voxa-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: voxa
        enclii.dev/managed-by: switchyard
        enclii.dev/environment: staging
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: voxa-web
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/madfam-org/voxa/voxa-web@sha256:bc23c6590e944df6236a5972a8148f2df77e6b9690c8e2beaec15b1e75ed8466
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: NEXT_PUBLIC_API_URL
              value: "https://voxa-api-staging.madfam.io"
            - name: NEXT_PUBLIC_OIDC_ISSUER
              value: "https://auth.madfam.io"
            - name: OIDC_ISSUER
              value: "https://auth.madfam.io"
            - name: NEXT_PUBLIC_OIDC_CLIENT_ID
              value: "jnc_4qRWyI-ul_GL28hrSxrX7AvIyotFMBuB"
            - name: OIDC_CLIENT_ID
              value: "jnc_4qRWyI-ul_GL28hrSxrX7AvIyotFMBuB"
            - name: NEXT_PUBLIC_BASE_URL
              value: "https://voxa-staging.madfam.io"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voxa-secrets
                  key: OIDC_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Liveness: the process answers at all (no config or dependency checks,
          # so a config problem never crash-loops the pod).
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          # Readiness: the server can serve what it advertises (sign-in config
          # present). Gates traffic to new pods during rollouts.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          # Let the endpoint removal reach the Service and tunnel before the
          # process gets SIGTERM, so in-flight and new requests do not hit a
          # closing socket (node:22-alpine ships /bin/sleep).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
