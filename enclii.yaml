apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: voxa
  project: voxa
spec:
  # Canonical MADFAM domain pattern (production):
  #   voxa.madfam.io      — platform root (AAC communicator web)
  #   voxa-app.madfam.io  — explicit app entry (same web service)
  #   voxa-api.madfam.io  — cloud sync + AI API
  runtime:
    port: 80
  # Staging uses single-level subdomains (Universal SSL covers *.madfam.io only):
  #   voxa-staging.madfam.io
  #   voxa-app-staging.madfam.io
  #   voxa-api-staging.madfam.io
  domains:
    - name: voxa.madfam.io
      environment: production
    - name: voxa-app.madfam.io
      environment: production
    - name: voxa-api.madfam.io
      environment: production
    - name: voxa-staging.madfam.io
      environment: staging
    - name: voxa-app-staging.madfam.io
      environment: staging
    - name: voxa-api-staging.madfam.io
      environment: staging
  network:
    services:
      - name: voxa-web
        port: 3000
        ingress: [cloudflare-tunnel]
        egress: [dns, https]
      - name: voxa-api
        port: 8080
        ingress: [cloudflare-tunnel]
        egress: [dns, https, postgres, redis, janua, pgbouncer]
    custom:
      - name: web-to-api
        from:
          app.kubernetes.io/name: voxa-web
        to:
          app.kubernetes.io/name: voxa-api
        port: 8080
        direction: both
  status:
    enabled: true
    entries:
      - name: Voxa
        url: https://voxa.madfam.io/api/health
        href: https://voxa.madfam.io
        group: Voxa
        family: AAC Platform
        description: AAC communication platform (web)
      - name: Voxa App
        url: https://voxa-app.madfam.io/api/health
        href: https://voxa-app.madfam.io
        group: Voxa
        family: AAC Platform
        description: AAC communicator web app
      - name: Voxa API
        url: https://voxa-api.madfam.io/health
        href: https://voxa-api.madfam.io
        group: Voxa
        family: AAC Platform
        description: Cloud sync and AI API
      - name: Voxa Staging
        url: https://voxa-staging.madfam.io/api/health
        href: https://voxa-staging.madfam.io
        group: Voxa
        family: AAC Platform
        description: Staging web (AAC communicator)
      - name: Voxa API Staging
        url: https://voxa-api-staging.madfam.io/health
        href: https://voxa-api-staging.madfam.io
        group: Voxa
        family: AAC Platform
        description: Staging cloud sync and AI API
