name: Deploy Voxa Web (Staging)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "apps/web/Dockerfile"
      - ".github/workflows/deploy-voxa-web-staging.yml"
      - "!k8s/staging/kustomization.yaml"

# Staging rebuilds from main on every merge that touches this app, beside the
# production workflow for the same paths. It never gates production: it has its
# own concurrency group, its own build cache scope (it reads the production cache
# but never writes to it), its own image tags and only ever writes k8s/staging/.
# A staging failure shows as a red staging run and changes nothing else.
#
# One group per workflow: GitHub keeps only the newest pending run per group,
# so a shared web+API group let one workflow's pending run displace the
# other's. The digest pin step fetches, resets to origin/main and retries its
# push, so the two workflows cannot clobber each other's pin.
concurrency:
  group: voxa-web-staging
  cancel-in-progress: false

# Least privilege by default; the build job below asks for exactly what it
# uses: packages (push to GHCR), id-token (keyless cosign signing) and
# contents: write (commit the digest pin to main).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Do not publish Docker build-record artifacts from this public repo
  # (repo-boundary contract, class 7: public Actions artifacts).
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  IMAGE_NAME: madfam-org/voxa/voxa-web

jobs:
  build-and-push:
    name: Build & Push Web Image (Staging)
    runs-on: ubuntu-24.04
    # Build (~10 min) + sign + pin + up to 12 min waiting for the new build.
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://voxa-api-staging.madfam.io
            NEXT_PUBLIC_BASE_URL=https://voxa-staging.madfam.io
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          cache-from: |
            type=gha,scope=voxa-web-staging
            type=gha
          cache-to: type=gha,mode=max,scope=voxa-web-staging
          provenance: false
          sbom: false

      # Held at cosign-installer v3 (cosign v2): cosign v3 writes signatures as
      # OCI referrers in the new bundle format, which the cluster's Kyverno
      # (v1.11, verify-image-signatures) does not read. See .github/dependabot.yml.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Retry the sign call: on 2026-08-26 crea-frontend run 33010085743 the
      # GitHub OIDC endpoint transiently returned non-JSON ("invalid character
      # 'u' looking for beginning of value"), the image was already pushed, and
      # the chain stopped BEFORE the digest pin — main went green while the live
      # host kept serving the previous build. Transient: a rerun succeeded.
      - name: Sign image with cosign
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      - name: Commit image digest
        id: pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Four workflows pin into main (web/api x production/staging), so the
          # staging pin retries more times than production, with jitter.
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cd k8s/staging
            kustomize edit set image voxa-web=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}
            cd ../..
            python3 <<'PY'
          import datetime
          import os, re, pathlib, sys
          digest = os.environ["DIGEST"]
          restarted = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          path = pathlib.Path("k8s/staging/voxa-web-deployment.yaml")
          text = path.read_text()
          text, count = re.subn(
              r"(image:\s+)ghcr\.io/madfam-org/voxa/voxa-web@sha256:[a-f0-9]+",
              rf"\1ghcr.io/madfam-org/voxa/voxa-web@{digest}",
              text,
              count=1,
          )
          if not count:
              print("Could not update staging voxa-web deployment image", file=sys.stderr)
              sys.exit(1)
          text, restart_count = re.subn(
              r'kubectl\.kubernetes\.io/restartedAt: "[^"]+"',
              f'kubectl.kubernetes.io/restartedAt: "{restarted}"',
              text,
              count=1,
          )
          if not restart_count:
              print("Could not bump staging voxa-web restartedAt annotation", file=sys.stderr)
              sys.exit(1)
          path.write_text(text)
          PY
            git add k8s/staging/kustomization.yaml k8s/staging/voxa-web-deployment.yaml
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            git commit -m "deploy(web): update staging digest to ${GITHUB_SHA::8}"
            git push origin main && exit 0
            echo "Retry $ATTEMPT..."
            sleep $((ATTEMPT * 3 + RANDOM % 5))
          done
          echo "Failed after 5 attempts"
          exit 1

      - name: Report lifecycle event
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/voxa\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"voxa-web staging ${STATUS} (digest: ${{ steps.build.outputs.digest }})\",
              \"metadata\": {
                \"service\": \"voxa-web\",
                \"environment\": \"staging\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\",
                \"digest\": \"${{ steps.build.outputs.digest }}\",
                \"workflow\": \"deploy-voxa-web-staging\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true

      # No Argo sync or restart step: the digest pin commit above also bumps the
      # pod template's restartedAt, and Argo CD auto-syncs the staging app
      # (automated sync with self-heal). The smoke below retries while the
      # rollout lands.
      # HTTP 200 alone is not proof: the previous pods answer it too. Wait for
      # /api/health to serve this commit's build, then check a public page.
      - name: Smoke test staging web
        if: success()
        run: |
          ./scripts/launch/wait-for-build.sh https://voxa-staging.madfam.io/api/health "${GITHUB_SHA}"
          # Sign-in stays on each host this web serves (anonymous GETs): the
          # Auth.js callback URL and the callback's error redirect must name
          # that host, never the 0.0.0.0 bind address (2026-10-04 incident).
          ./scripts/launch/verify-auth-public-origin.sh voxa-staging.madfam.io voxa-app-staging.madfam.io
          for i in 1 2 3; do
            p="$(curl -sS -o /dev/null -w '%{http_code}' https://voxa-staging.madfam.io/legal/privacy || true)"
            if [ "$p" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Smoke test failed: https://voxa-staging.madfam.io/legal/privacy=${p}" >&2
          exit 1

      # Loud-stale guard (2026-08-26 crea-frontend OIDC incident): the failure
      # mode that hurts is a pushed image whose digest pin never ran — main goes
      # green while the cluster still runs the previous digest. Make that state
      # name itself instead of hiding behind a green checkmark.
      - name: Fail loudly if image was pushed but never pinned
        if: always()
        run: |
          set -uo pipefail
          BUILD='${{ steps.build.outcome }}'
          SIGN='${{ steps.sign.outcome }}'
          PIN='${{ steps.pin.outcome }}'
          echo "build=${BUILD} sign=${SIGN} pin=${PIN}"
          if [ "${BUILD}" = "success" ] && { [ "${SIGN}" != "success" ] || [ "${PIN}" != "success" ]; }; then
            echo "::error title=Image pushed but NOT pinned/deployed::The image for ${GITHUB_SHA} was built and pushed to the registry, but signing and/or the digest pin did not complete. ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING THE PREVIOUS BUILD even though this commit is green on main. Rerun the failed jobs (gh run rerun ${GITHUB_RUN_ID} --failed)."
            exit 1
          fi
