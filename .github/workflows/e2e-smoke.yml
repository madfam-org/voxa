name: Daily smoke

# Two independent jobs, every day and on demand. Nothing here writes to the
# repository or to production.
#
# - `smoke`: read-only checks of production's public pages (landing, demo,
#   legal, sign-in page).
# - `staging-signed-in`: the signed-in specs against staging, which rebuilds
#   from main on every merge (deploy-voxa-*-staging.yml). They sign in as the
#   staging test account and write test boards, consent choices and media to
#   staging only. Without the staging credentials the job logs why and skips.
#   Staging never gates production deploys; a red run here is a staging signal.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: read

concurrency:
  group: daily-smoke
  cancel-in-progress: true

env:
  VOXA_PROD_WEB_URL: https://voxa.madfam.io
  VOXA_PROD_API_URL: https://voxa-api.madfam.io

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e

      - name: Production GA gate (API health, auth enforced, public pages)
        run: ./scripts/launch/verify-prod-ga.sh

      - name: Production demo serves the Mulberry board and no third-party symbols
        run: ./scripts/launch/verify-prod-demo.sh
        env:
          VOXA_DEMO_VERIFY_ATTEMPTS: '3'

      # Warns (does not fail) while the production API has no Redis bound:
      # co-edit events then reach only clients on the same pod.
      - name: Production Redis co-edit readiness
        run: ./scripts/launch/verify-prod-redis.sh

      - name: Playwright smoke (production public pages)
        run: pnpm test:e2e:smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.VOXA_PROD_WEB_URL }}

      - name: Axe scan (production public pages)
        run: pnpm --filter @voxa/e2e exec playwright test -c playwright.config.ts specs/a11y.spec.ts --grep "public pages" --workers=1
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.VOXA_PROD_WEB_URL }}

  staging-signed-in:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VOXA_STAGING_WEB_URL: https://voxa-staging.madfam.io
      VOXA_STAGING_API_URL: https://voxa-api-staging.madfam.io
    steps:
      - name: Check staging credentials
        id: creds
        env:
          JANUA_TEST_EMAIL: ${{ secrets.VOXA_STAGING_TEST_EMAIL }}
          JANUA_TEST_PASSWORD: ${{ secrets.VOXA_STAGING_TEST_PASSWORD }}
          OIDC_CLIENT_ID: ${{ secrets.VOXA_STAGING_OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.VOXA_STAGING_OIDC_CLIENT_SECRET }}
        run: |
          if [ -z "${JANUA_TEST_EMAIL}" ] || [ -z "${JANUA_TEST_PASSWORD}" ]; then
            echo "::notice title=Signed-in staging specs skipped::VOXA_STAGING_TEST_EMAIL and VOXA_STAGING_TEST_PASSWORD are not set, so the signed-in specs did not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ -z "${OIDC_CLIENT_ID}" ] || [ -z "${OIDC_CLIENT_SECRET}" ]; then
            echo "::notice title=Staging API soak skipped::VOXA_STAGING_OIDC_CLIENT_ID and VOXA_STAGING_OIDC_CLIENT_SECRET are not set, so staging-auth.spec.ts skips; the browser specs still run."
            echo "token=false" >> "$GITHUB_OUTPUT"
          else
            echo "token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.run == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.creds.outputs.run == 'true'
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.run == 'true'
      - run: pnpm exec playwright install chromium --with-deps
        if: steps.creds.outputs.run == 'true'
        working-directory: e2e

      - name: Staging is up
        id: up
        if: steps.creds.outputs.run == 'true'
        run: |
          for url in "${VOXA_STAGING_WEB_URL}/api/health" "${VOXA_STAGING_API_URL}/health"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "${url} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "::error title=Staging is down::${url} answered ${code}; the signed-in specs need a live staging."
              exit 1
            fi
          done

      - name: Staging API access token
        if: steps.creds.outputs.run == 'true' && steps.creds.outputs.token == 'true'
        env:
          OIDC_CLIENT_ID: ${{ secrets.VOXA_STAGING_OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.VOXA_STAGING_OIDC_CLIENT_SECRET }}
          JANUA_TEST_EMAIL: ${{ secrets.VOXA_STAGING_TEST_EMAIL }}
          JANUA_TEST_PASSWORD: ${{ secrets.VOXA_STAGING_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(./scripts/launch/fetch-staging-access-token.sh)"
          echo "::add-mask::${token}"
          echo "VOXA_TEST_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"

      # Runs even when the token step failed (that failure still fails the job),
      # so a Janua token problem does not hide the browser results.
      - name: Signed-in specs (staging)
        if: ${{ !cancelled() && steps.creds.outputs.run == 'true' && steps.up.outcome == 'success' }}
        run: pnpm test:e2e:staging:signed-in
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.VOXA_STAGING_WEB_URL }}
          JANUA_TEST_EMAIL: ${{ secrets.VOXA_STAGING_TEST_EMAIL }}
          JANUA_TEST_PASSWORD: ${{ secrets.VOXA_STAGING_TEST_PASSWORD }}
