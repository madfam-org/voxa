name: Deploy Voxa API (Production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "apps/api/Dockerfile"
      - "!k8s/production/kustomization.yaml"

concurrency:
  group: voxa-kustomization-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: madfam-org/voxa/voxa-api

jobs:
  build-and-push:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Retry the sign call: on 2026-08-26 crea-frontend run 33010085743 the
      # GitHub OIDC endpoint transiently returned non-JSON ("invalid character
      # 'u' looking for beginning of value"), the image was already pushed, and
      # the chain stopped BEFORE the digest pin — main went green while the live
      # host kept serving the previous build. Transient: a rerun succeeded.
      - name: Sign image with cosign
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      - name: Commit image digest
        id: pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cd k8s/production
            kustomize edit set image voxa-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}
            cd ../..
            python3 <<'PY'
          import os, re, pathlib, sys
          digest = os.environ["DIGEST"]
          path = pathlib.Path("k8s/production/voxa-api-deployment.yaml")
          text = path.read_text()
          text, count = re.subn(
              r"(image:\s+)ghcr\.io/madfam-org/voxa/voxa-api@sha256:[a-f0-9]+",
              rf"\1ghcr.io/madfam-org/voxa/voxa-api@{digest}",
              text,
              count=1,
          )
          if not count:
              print("Could not update voxa-api deployment image", file=sys.stderr)
              sys.exit(1)
          path.write_text(text)
          PY
            git add k8s/production/kustomization.yaml k8s/production/voxa-api-deployment.yaml
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            git commit -m "deploy(api): update production digest to ${GITHUB_SHA::8}"
            git push origin main && exit 0
            echo "Retry $ATTEMPT..."
            sleep $((ATTEMPT * 2))
          done
          echo "Failed after 3 attempts"
          exit 1

      - name: Report lifecycle event
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/voxa\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"voxa-api ${STATUS} (digest: ${{ steps.build.outputs.digest }})\",
              \"metadata\": {
                \"service\": \"voxa-api\",
                \"environment\": \"production\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\",
                \"digest\": \"${{ steps.build.outputs.digest }}\",
                \"workflow\": \"deploy-voxa-api\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true

      - name: Smoke test production API
        if: success()
        run: |
          for i in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/voxa-health.json -w '%{http_code}' https://voxa-api.madfam.io/health || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/voxa-health.json
              exit 0
            fi
            sleep 20
          done
          echo "Smoke test failed: https://voxa-api.madfam.io/health" >&2
          exit 1

      # Loud-stale guard (2026-08-26 crea-frontend OIDC incident): the failure
      # mode that hurts is a pushed image whose digest pin never ran — main goes
      # green while the cluster still runs the previous digest. Make that state
      # name itself instead of hiding behind a green checkmark.
      - name: Fail loudly if image was pushed but never pinned
        if: always()
        run: |
          set -uo pipefail
          BUILD='${{ steps.build.outcome }}'
          SIGN='${{ steps.sign.outcome }}'
          PIN='${{ steps.pin.outcome }}'
          echo "build=${BUILD} sign=${SIGN} pin=${PIN}"
          if [ "${BUILD}" = "success" ] && { [ "${SIGN}" != "success" ] || [ "${PIN}" != "success" ]; }; then
            echo "::error title=Image pushed but NOT pinned/deployed::The image for ${GITHUB_SHA} was built and pushed to the registry, but signing and/or the digest pin did not complete. ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING THE PREVIOUS BUILD even though this commit is green on main. Rerun the failed jobs (gh run rerun ${GITHUB_RUN_ID} --failed)."
            exit 1
          fi
