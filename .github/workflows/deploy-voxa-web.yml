name: Deploy Voxa Web (Production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "apps/web/Dockerfile"
      - "!k8s/production/kustomization.yaml"

concurrency:
  group: voxa-kustomization-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: madfam-org/voxa/voxa-web

jobs:
  build-and-push:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://voxa-api.madfam.io
            NEXT_PUBLIC_BASE_URL=https://voxa.madfam.io
            NEXT_PUBLIC_OIDC_ISSUER=https://auth.madfam.io
            NEXT_PUBLIC_OIDC_CLIENT_ID=${{ vars.NEXT_PUBLIC_OIDC_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Commit image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cd k8s/production
            kustomize edit set image voxa-web=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}
            cd ../..
            python3 <<'PY'
          import datetime
          import os, re, pathlib, sys
          digest = os.environ["DIGEST"]
          restarted = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          path = pathlib.Path("k8s/production/voxa-web-deployment.yaml")
          text = path.read_text()
          text, count = re.subn(
              r"(image:\s+)ghcr\.io/madfam-org/voxa/voxa-web@sha256:[a-f0-9]+",
              rf"\1ghcr.io/madfam-org/voxa/voxa-web@{digest}",
              text,
              count=1,
          )
          if not count:
              print("Could not update voxa-web deployment image", file=sys.stderr)
              sys.exit(1)
          text, restart_count = re.subn(
              r'kubectl\.kubernetes\.io/restartedAt: "[^"]+"',
              f'kubectl.kubernetes.io/restartedAt: "{restarted}"',
              text,
              count=1,
          )
          if not restart_count:
              print("Could not bump voxa-web restartedAt annotation", file=sys.stderr)
              sys.exit(1)
          path.write_text(text)
          PY
            git add k8s/production/kustomization.yaml k8s/production/voxa-web-deployment.yaml
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            git commit -m "deploy(web): update production digest to ${GITHUB_SHA::8}"
            git push origin main && exit 0
            echo "Retry $ATTEMPT..."
            sleep $((ATTEMPT * 2))
          done
          echo "Failed after 3 attempts"
          exit 1

      - name: Report lifecycle event
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/voxa\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"voxa-web ${STATUS} (digest: ${{ steps.build.outputs.digest }})\",
              \"metadata\": {
                \"service\": \"voxa-web\",
                \"environment\": \"production\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\",
                \"digest\": \"${{ steps.build.outputs.digest }}\",
                \"workflow\": \"deploy-voxa-web\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true

      - name: Sync Argo and restart voxa-web
        if: success()
        env:
          JANUA_ADMIN_EMAIL: ${{ secrets.MADFAM_ADMIN_EMAIL }}
          JANUA_ADMIN_PASSWORD: ${{ secrets.MADFAM_ADMIN_PASSWORD }}
        run: |
          if [ -z "${JANUA_ADMIN_EMAIL}" ] || [ -z "${JANUA_ADMIN_PASSWORD}" ]; then
            echo "MADFAM_ADMIN_* secrets not configured — skipping Argo sync + web restart"
            exit 0
          fi
          chmod +x scripts/deploy/enclii-token-from-janua.sh scripts/deploy/sync-voxa-services.sh scripts/deploy/restart-voxa-web.sh
          eval "$(JANUA_ADMIN_EMAIL="${JANUA_ADMIN_EMAIL}" JANUA_ADMIN_PASSWORD="${JANUA_ADMIN_PASSWORD}" ./scripts/deploy/enclii-token-from-janua.sh)"
          ./scripts/deploy/sync-voxa-services.sh voxa-services
          sleep 45
          ENCLII_TOKEN="${ENCLII_TOKEN}" ./scripts/deploy/restart-voxa-web.sh prod

      - name: Smoke test production web
        if: success()
        run: |
          chmod +x scripts/launch/verify-prod-ga.sh scripts/launch/verify-prod-demo.sh
          ./scripts/launch/verify-prod-ga.sh || true
          ./scripts/launch/verify-prod-demo.sh

      - name: Restart voxa-web pods (optional legacy token)
        if: success()
        env:
          ENCLII_TOKEN: ${{ secrets.ENCLII_TOKEN }}
        run: |
          if [ -z "${ENCLII_TOKEN}" ]; then
            exit 0
          fi
          chmod +x scripts/deploy/restart-voxa-web.sh
          ./scripts/deploy/restart-voxa-web.sh prod
