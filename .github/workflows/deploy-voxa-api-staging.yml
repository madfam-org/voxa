name: Deploy Voxa API (Staging)

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "apps/api/Dockerfile"
      - "!k8s/staging/kustomization.yaml"

concurrency:
  group: voxa-kustomization-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: madfam-org/voxa/voxa-api

jobs:
  build-and-push:
    name: Build & Push API Image (Staging)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Commit image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin staging
            git reset --hard origin/staging
            cd k8s/staging
            kustomize edit set image voxa-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}
            cd ../..
            python3 <<'PY'
          import os, re, pathlib, sys
          digest = os.environ["DIGEST"]
          path = pathlib.Path("k8s/staging/voxa-api-deployment.yaml")
          text = path.read_text()
          text, count = re.subn(
              r"(image:\s+)ghcr\.io/madfam-org/voxa/voxa-api@sha256:[a-f0-9]+",
              rf"\1ghcr.io/madfam-org/voxa/voxa-api@{digest}",
              text,
              count=1,
          )
          if not count:
              print("Could not update staging voxa-api deployment image", file=sys.stderr)
              sys.exit(1)
          path.write_text(text)
          PY
            git add k8s/staging/kustomization.yaml k8s/staging/voxa-api-deployment.yaml
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            git commit -m "deploy(api): update staging digest to ${GITHUB_SHA::8}"
            git push origin staging && exit 0
            echo "Retry $ATTEMPT..."
            sleep $((ATTEMPT * 2))
          done
          echo "Failed after 3 attempts"
          exit 1

      - name: Report lifecycle event
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/voxa\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"voxa-api staging ${STATUS} (digest: ${{ steps.build.outputs.digest }})\",
              \"metadata\": {
                \"service\": \"voxa-api\",
                \"environment\": \"staging\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\",
                \"digest\": \"${{ steps.build.outputs.digest }}\",
                \"workflow\": \"deploy-voxa-api-staging\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true
