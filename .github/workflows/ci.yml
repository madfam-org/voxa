name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI never writes to the repository, packages or releases.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's superseded run.
# Runs on main get one group per commit: a shared group would let GitHub drop
# a pending run when a newer one queues (it keeps only the newest pending run
# per group), so a merged commit could go unchecked.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # Throwaway PostgreSQL for the API's *.pg.test.ts files (real migrations,
    # one shared pool, the atomic version guard) and throwaway Redis for
    # src/ws/sync-hub.redis.test.ts (two API replicas co-editing one board).
    # Without VOXA_TEST_DATABASE_URL / VOXA_TEST_REDIS_URL those files skip
    # locally; with CI=true (always set on Actions) a missing or unreachable
    # service fails the run instead (src/test-support/test-services.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: voxa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d voxa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Repository guards (test discovery, licence R86, LLM egress R88, public-repo hygiene)
        # scripts/guards/check.mjs prints a read-proof and file:line per finding,
        # never the matched text. The second command unit-tests each matcher
        # against bad fixtures and its allowlist. See AGENTS.md "Guards".
        run: |
          pnpm guards
          pnpm test:guards
      - run: pnpm turbo typecheck
      - run: pnpm test
        env:
          VOXA_TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/voxa_test
          VOXA_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - name: Drizzle schema has no unmigrated changes
        run: |
          set -euo pipefail
          timeout 120 pnpm --filter @voxa/api exec drizzle-kit generate
          drift="$(git status --porcelain -- apps/api/drizzle)"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::drizzle-kit generate produced changes: apps/api/src/db/schema.ts differs from the latest snapshot in apps/api/drizzle/migrations/meta. Run 'pnpm --filter @voxa/api db:generate' and commit the migration, journal entry and snapshot."
            exit 1
          fi
      - run: ./scripts/mobile/verify-eas-config.sh
      - name: Mobile bundle check (Android JS export, no credentials)
        run: pnpm --filter @voxa/mobile exec expo export --platform android --output-dir "${RUNNER_TEMP}/expo-export"
      - run: pnpm build

  a11y:
    runs-on: ubuntu-24.04
    needs: build
    env:
      # Test-only sign-in settings for the standalone server below: the
      # Playwright helpers encrypt sessions with this secret
      # (e2e/helpers/test-session.ts), and session-account.spec.ts serves a
      # stand-in Janua on this port. Never deployed anywhere.
      VOXA_E2E_AUTH_SECRET: voxa-e2e-test-only-auth-secret-not-for-deploy
      VOXA_E2E_JANUA_PORT: "4455"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voxa/web... build
      # The offline/media spec starts the built API itself (file store, test JWKS).
      - run: pnpm --filter @voxa/api... build
      - name: Prepare standalone server
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public 2>/dev/null || true
      - run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e
      - name: Start web for axe scans
        working-directory: apps/web/.next/standalone
        run: node apps/web/server.js &
        env:
          PORT: 3000
          # Same bind as production (apps/web/Dockerfile, k8s). With a specific
          # address such as 127.0.0.1, Next 15's standalone server hands
          # middleware a request URL on `localhost`, so next-intl's internal
          # rewrite of an unprefixed Spanish path (/ -> /es) carries another
          # origin, is proxied as an external rewrite and redirects back to
          # itself (ERR_TOO_MANY_REDIRECTS): Spanish pages could not be scanned.
          HOSTNAME: 0.0.0.0
          AUTH_SECRET: ${{ env.VOXA_E2E_AUTH_SECRET }}
          AUTH_JANUA_ISSUER: http://127.0.0.1:${{ env.VOXA_E2E_JANUA_PORT }}
          AUTH_JANUA_CLIENT_ID: voxa-e2e-client
          AUTH_JANUA_CLIENT_SECRET: voxa-e2e-client-secret-not-for-deploy
      - name: Wait for web
        run: npx --yes wait-on http://127.0.0.1:3000/api/health --timeout 120000
      - name: Image optimizer is off (/_next/image -> 404)
        # GHSA-2xp9-vwfh-vxw4: apps/web/next.config.ts sets images.unoptimized.
        run: VOXA_PROD_WEB_URL=http://127.0.0.1:3000 VOXA_IMAGE_VERIFY_ATTEMPTS=1 ./scripts/launch/verify-prod-image-optimizer.sh
      - run: pnpm test:e2e:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Voice choice and tuning (stubbed speech synthesis, axe on the Voice settings)
        # e2e/specs/voice-choice.spec.ts: button, Speak and a prediction chip speak
        # with the chosen voiceURI, rate/pitch/volume and lang = the board locale.
        # No API: the board comes from the offline cache.
        run: pnpm test:e2e:voices
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Offline start, uploaded media, GLP video, spoken fallback
        # e2e/specs/offline-media.spec.ts: reload /app offline (service worker),
        # uploaded photo through the media proxy, visible GLP video, TTS when
        # media answers 503. The web build calls the API at its default URL.
        run: pnpm test:e2e:offline
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VOXA_E2E_API_URL: http://localhost:4000
      - name: Access methods (touch-only move, motor-plan override, refused saves, Classic light signed-in)
        # e2e/specs/access-methods.spec.ts: same local API as the offline spec.
        run: pnpm test:e2e:access
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VOXA_E2E_API_URL: http://localhost:4000
      - name: Board import creates a new board and leaves the open one untouched
        # e2e/specs/board-import.spec.ts: confirm, import as a NEW board, open
        # it; the board on screen keeps its version; a 402 shows the plan-limit notice; beta labels on Grid 3,
        # Snap and TouchChat. Same local API port as the offline step.
        run: pnpm --filter @voxa/e2e test:import
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VOXA_E2E_API_URL: http://localhost:4000
      - name: First-run setup (switch scanning + 36 cells + a voice -> 36-cell es-MX board; axe on every step, light and dark)
        # e2e/specs/first-run.spec.ts: a new signed-in user ends on /app with a
        # 36-cell es-MX board and scanning on; a returning user and /demo never
        # see the setup; a 402 offers the existing board. Same local API port.
        run: pnpm --filter @voxa/e2e test:first-run
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VOXA_E2E_API_URL: http://localhost:4000
      - name: Sessions, sign-out and account switching
        # e2e/specs/session-account.spec.ts: no token reaches page scripts,
        # POST-only sign-out with RP-initiated logout, both switching controls
        # (prompt=select_account / prompt=login) with local data purged, and a
        # write queued by one account never sent under another.
        run: pnpm test:e2e:session
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
