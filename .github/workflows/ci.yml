name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    # Throwaway PostgreSQL for apps/api/src/routes/media.pg.test.ts, which runs
    # the real migrations and proves the API keeps one shared database pool.
    # Without VOXA_TEST_DATABASE_URL that test file skips itself.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: voxa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d voxa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck
      - run: pnpm test
        env:
          VOXA_TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/voxa_test
      - name: Drizzle schema has no unmigrated changes
        run: |
          set -euo pipefail
          timeout 120 pnpm --filter @voxa/api exec drizzle-kit generate
          drift="$(git status --porcelain -- apps/api/drizzle)"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::drizzle-kit generate produced changes: apps/api/src/db/schema.ts differs from the latest snapshot in apps/api/drizzle/migrations/meta. Run 'pnpm --filter @voxa/api db:generate' and commit the migration, journal entry and snapshot."
            exit 1
          fi
      - run: ./scripts/mobile/verify-eas-config.sh
      - name: Mobile bundle check (Android JS export, no credentials)
        run: pnpm --filter @voxa/mobile exec expo export --platform android --output-dir "${RUNNER_TEMP}/expo-export"
      - run: pnpm build

  a11y:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voxa/web... build
      # The offline/media spec starts the built API itself (file store, test JWKS).
      - run: pnpm --filter @voxa/api... build
      - name: Prepare standalone server
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public 2>/dev/null || true
      - run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e
      - name: Start web for axe scans
        working-directory: apps/web/.next/standalone
        run: node apps/web/server.js &
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1
      - name: Wait for web
        run: npx --yes wait-on http://127.0.0.1:3000/api/health --timeout 120000
      - name: Image optimizer is off (/_next/image -> 404)
        # GHSA-2xp9-vwfh-vxw4: apps/web/next.config.ts sets images.unoptimized.
        run: VOXA_PROD_WEB_URL=http://127.0.0.1:3000 VOXA_IMAGE_VERIFY_ATTEMPTS=1 ./scripts/launch/verify-prod-image-optimizer.sh
      - run: pnpm test:e2e:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Offline start, uploaded media, GLP video, spoken fallback
        # e2e/specs/offline-media.spec.ts: reload /app offline (service worker),
        # uploaded photo through the media proxy, visible GLP video, TTS when
        # media answers 503. The web build calls the API at its default URL.
        run: pnpm test:e2e:offline
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VOXA_E2E_API_URL: http://localhost:4000
      - name: Access methods (touch-only move, motor-plan override, refused saves, Classic light signed-in)
        # e2e/specs/access-methods.spec.ts: same local API as the offline spec.
        run: pnpm test:e2e:access
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VOXA_E2E_API_URL: http://localhost:4000
      - name: Board import creates a new board and leaves the open one untouched
        # e2e/specs/board-import.spec.ts: confirm, import as a NEW board, open
        # it; the board on screen keeps its version; a 402 shows the plan-limit notice; beta labels on Grid 3,
        # Snap and TouchChat. Same local API port as the offline step.
        run: pnpm --filter @voxa/e2e test:import
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VOXA_E2E_API_URL: http://localhost:4000
