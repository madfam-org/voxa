name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  a11y:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voxa/web... build
      - name: Prepare standalone server
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public 2>/dev/null || true
      - run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e
      - name: Start web for axe scans
        run: node apps/web/.next/standalone/apps/web/server.js &
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1
      - name: Wait for web
        run: npx --yes wait-on http://127.0.0.1:3000 --timeout 120000
      - run: pnpm test:e2e:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
