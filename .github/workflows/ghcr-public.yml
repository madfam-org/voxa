name: GHCR public visibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public:
    name: Set Voxa packages public
    runs-on: ubuntu-24.04
    # The only grant this job uses: `gh api -X PATCH` on the org's container
    # packages. It never checks out the repository.
    permissions:
      packages: write
    steps:
      - name: Patch package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in voxa%2Fvoxa-api voxa%2Fvoxa-web; do
            echo "== madfam-org/${pkg} =="
            visibility="$(gh api "orgs/madfam-org/packages/container/${pkg}" --jq '.visibility')"
            echo "  current: ${visibility}"
            if [[ "${visibility}" == "public" ]]; then
              echo "  already public"
              continue
            fi
            gh api -X PATCH "orgs/madfam-org/packages/container/${pkg}" \
              -f visibility=public \
              --jq '{name, visibility, updated_at}'
          done
