name: Mobile EAS Preview

on:
  workflow_dispatch:

concurrency:
  group: mobile-eas-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.repository == 'madfam-org/voxa'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify EAS configuration
        run: ./scripts/mobile/verify-eas-config.sh

      - name: TestFlight readiness summary
        run: ./scripts/mobile/verify-testflight-readiness.sh || true

      - name: Typecheck mobile app
        continue-on-error: true
        run: pnpm --filter @voxa/mobile typecheck

      - name: Test mobile app
        run: pnpm --filter @voxa/mobile test

      - name: Skip when EXPO_TOKEN is not configured
        if: secrets.EXPO_TOKEN == ''
        run: |
          echo 'EXPO_TOKEN GitHub secret is not set; skipping EAS preview build.'
          echo 'Configure EXPO_TOKEN and re-run workflow_dispatch to build TestFlight/Play internal binaries.'

      - uses: expo/expo-github-action@v8
        if: secrets.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Require linked EAS project before build
        if: secrets.EXPO_TOKEN != ''
        run: REQUIRE_LINKED=1 ./scripts/mobile/verify-eas-config.sh

      - name: EAS preview build (staging API)
        if: secrets.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: |
          args=(build --profile preview --platform all --non-interactive)
          if [[ "${{ vars.EAS_AUTO_SUBMIT }}" == 'true' ]]; then
            REQUIRE_SUBMIT=1 "${GITHUB_WORKSPACE}/scripts/mobile/verify-testflight-readiness.sh"
            args+=(--auto-submit)
          fi
          eas "${args[@]}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
