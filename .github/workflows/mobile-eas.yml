name: Mobile EAS Preview

on:
  workflow_dispatch:

concurrency:
  group: mobile-eas-preview
  cancel-in-progress: true

# Read-only token: EAS authenticates with EXPO_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    if: github.repository == 'madfam-org/voxa'
    env:
      # Identifiers live in repository variables, never in the repo. See
      # docs/launch/MOBILE_GA.md for the names and how to set them.
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EAS_PROJECT_OWNER: ${{ vars.EAS_PROJECT_OWNER }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify EAS configuration
        run: ./scripts/mobile/verify-eas-config.sh

      - name: TestFlight readiness summary
        run: ./scripts/mobile/verify-testflight-readiness.sh

      - name: Typecheck mobile app
        run: pnpm turbo typecheck --filter=@voxa/mobile

      - name: Test mobile app
        run: pnpm --filter @voxa/mobile test

      - name: Bundle check (Android JS export, no credentials)
        run: pnpm --filter @voxa/mobile exec expo export --platform android --output-dir "${RUNNER_TEMP}/expo-export"

      # The `secrets` context is NOT available in step-level `if:` expressions.
      # Referencing it there makes GitHub reject the whole workflow at parse
      # time (run is created with 0 jobs and no logs). Detect the secret in a
      # shell step and gate on its output instead.
      - name: Detect EAS credentials
        id: eas_creds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -n "${EXPO_TOKEN:-}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'EXPO_TOKEN GitHub secret is not set; skipping EAS preview build.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Configure EXPO_TOKEN and re-run workflow_dispatch to build TestFlight/Play internal binaries.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9
        if: steps.eas_creds.outputs.configured == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Require linked EAS project before build
        if: steps.eas_creds.outputs.configured == 'true'
        run: REQUIRE_LINKED=1 ./scripts/mobile/verify-eas-config.sh

      - name: Write store submission keys
        if: steps.eas_creds.outputs.configured == 'true' && vars.EAS_AUTO_SUBMIT == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./scripts/mobile/write-store-keys.sh

      - name: EAS preview build (staging API)
        if: steps.eas_creds.outputs.configured == 'true'
        working-directory: apps/mobile
        run: |
          args=(build --profile preview --platform all --non-interactive)
          if [[ "${{ vars.EAS_AUTO_SUBMIT }}" == 'true' ]]; then
            REQUIRE_SUBMIT=1 "${GITHUB_WORKSPACE}/scripts/mobile/verify-testflight-readiness.sh"
            node "${GITHUB_WORKSPACE}/scripts/mobile/eas-submit-env.mjs" --apply --profile preview --platform all
            args+=(--auto-submit)
          fi
          eas "${args[@]}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VOXA_REQUIRE_EAS_PROJECT: '1'
