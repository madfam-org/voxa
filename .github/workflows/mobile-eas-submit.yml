name: Mobile EAS Submit

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS submit profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android

concurrency:
  group: mobile-eas-submit
  cancel-in-progress: false

# Read-only token: EAS authenticates with EXPO_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    if: github.repository == 'madfam-org/voxa'
    env:
      # Identifiers live in repository variables, never in the repo. See
      # docs/launch/MOBILE_GA.md for the names and how to set them.
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EAS_PROJECT_OWNER: ${{ vars.EAS_PROJECT_OWNER }}
      VOXA_REQUIRE_EAS_PROJECT: '1'
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The `secrets` context is NOT available in step-level `if:` expressions.
      # Referencing it there makes GitHub reject the whole workflow at parse
      # time (run is created with 0 jobs and no logs). Check the secret inside
      # the shell instead. Submitting without credentials is meaningless, so
      # this lane fails loudly rather than skipping.
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo 'EXPO_TOKEN GitHub secret is not set; cannot submit to TestFlight / Play.'
            exit 1
          fi

      - name: Write store submission keys
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./scripts/mobile/write-store-keys.sh

      - name: Verify EAS project and store settings
        env:
          REQUIRE_LINKED: '1'
        run: |
          ./scripts/mobile/verify-eas-config.sh
          node scripts/mobile/eas-submit-env.mjs --apply --profile "${{ inputs.profile }}" --platform "${{ inputs.platform }}"

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS submit (${{ inputs.profile }})
        working-directory: apps/mobile
        run: eas submit --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive --latest
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
