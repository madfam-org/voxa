name: Mobile EAS Submit

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS submit profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android

concurrency:
  group: mobile-eas-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    if: github.repository == 'madfam-org/voxa'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The `secrets` context is NOT available in step-level `if:` expressions.
      # Referencing it there makes GitHub reject the whole workflow at parse
      # time (run is created with 0 jobs and no logs). Check the secret inside
      # the shell instead. Submitting without credentials is meaningless, so
      # this lane fails loudly rather than skipping.
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo 'EXPO_TOKEN GitHub secret is not set; cannot submit to TestFlight / Play.'
            exit 1
          fi

      - name: Verify TestFlight readiness
        env:
          REQUIRE_LINKED: '1'
          REQUIRE_SUBMIT: '1'
        run: ./scripts/mobile/verify-testflight-readiness.sh

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS submit (${{ inputs.profile }})
        working-directory: apps/mobile
        run: eas submit --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive --latest
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
